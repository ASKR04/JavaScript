name: Project quality

on:
  pull_request:
    branches:
      - aug_release
      - main
  push:
    branches:
      - aug_release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: Discover Node projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build project matrix
        id: projects
        shell: bash
        run: |
          project_paths="$(
            find . -mindepth 2 -maxdepth 3 -name package.json \
              -not -path '*/node_modules/*' -printf '%h\n' \
              | sed 's|^\./||' \
              | sort -u
          )"

          if [ -z "$project_paths" ]; then
            echo 'projects=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          projects="$(
            printf '%s\n' "$project_paths" \
              | jq -R -s -c 'split("\n") | map(select(length > 0))'
          )"
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  quality:
    name: Verify ${{ matrix.project }}
    needs: discover
    if: needs.discover.outputs.projects != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-package-lock
          fi

      - name: Lint project
        run: npm run lint --if-present

      - name: Test project
        run: npm test --if-present -- --passWithNoTests
        env:
          CI: true

      - name: Build project
        run: npm run build --if-present
